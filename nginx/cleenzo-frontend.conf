# Nginx for cleenzo.co.in — apply on EC2 carefully (proxies PM2 :3003).
# Canonical host: https://cleenzo.co.in (apex)
# Soft-404 prevention + trailing slash live in scripts/serve-production.cjs;
# this file focuses on TLS, www→apex, and HTTP→HTTPS.

# www HTTPS → apex (requires cert covering www — expand with certbot)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.cleenzo.co.in;

    ssl_certificate     /etc/letsencrypt/live/cleenzo.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cleenzo.co.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://cleenzo.co.in$request_uri;
}

# HTTP → HTTPS apex (apex + www)
server {
    listen 80;
    listen [::]:80;
    server_name cleenzo.co.in www.cleenzo.co.in;
    return 301 https://cleenzo.co.in$request_uri;
}

# Primary site — apex only → PM2 serve-production on :3003
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cleenzo.co.in;

    ssl_certificate     /etc/letsencrypt/live/cleenzo.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cleenzo.co.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Legacy / guessed paths (also handled in React URL_REDIRECTS)
    location = /laundry-service-raj-nagar-extension {
        return 301 https://cleenzo.co.in/laundry-service-ghaziabad/;
    }
    location = /laundry-service-raj-nagar-extension/ {
        return 301 https://cleenzo.co.in/laundry-service-ghaziabad/;
    }
    location = /shoe-cleaning-ghaziabad {
        return 301 https://cleenzo.co.in/shoe-cleaning/;
    }
    location = /shoe-cleaning-ghaziabad/ {
        return 301 https://cleenzo.co.in/shoe-cleaning/;
    }
    location = /commercial-laundry-ghaziabad {
        return 301 https://cleenzo.co.in/commercial-laundry/;
    }
    location = /commercial-laundry-ghaziabad/ {
        return 301 https://cleenzo.co.in/commercial-laundry/;
    }
    location = /indirapuram {
        return 301 https://cleenzo.co.in/laundry-dry-cleaning-indirapuram/;
    }
    location = /indirapuram/ {
        return 301 https://cleenzo.co.in/laundry-dry-cleaning-indirapuram/;
    }
    location = /vaishali {
        return 301 https://cleenzo.co.in/laundry-dry-cleaning-vaishali/;
    }
    location = /vaishali/ {
        return 301 https://cleenzo.co.in/laundry-dry-cleaning-vaishali/;
    }
    location = /noida-extension {
        return 301 https://cleenzo.co.in/laundry-dry-cleaning-noida-extension/;
    }
    location = /noida-extension/ {
        return 301 https://cleenzo.co.in/laundry-dry-cleaning-noida-extension/;
    }
    location = /steam-ironing {
        return 301 https://cleenzo.co.in/laundry-service-ghaziabad/;
    }
    location = /steam-ironing/ {
        return 301 https://cleenzo.co.in/laundry-service-ghaziabad/;
    }
    location = /pricing {
        return 301 https://cleenzo.co.in/#pricing;
    }
    location = /pricing/ {
        return 301 https://cleenzo.co.in/#pricing;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
