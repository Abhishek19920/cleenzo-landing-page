# Nginx config for cleenzo.co.in — apply on EC2: ./apply-nginx-seo.sh
# Canonical host: https://www.cleenzo.co.in
# Page URLs use trailing slash to match static folders (sitemap & canonicals)

# Redirect bare domain HTTPS → www (preserve path)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cleenzo.co.in;

    ssl_certificate     /etc/letsencrypt/live/cleenzo.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cleenzo.co.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.cleenzo.co.in$request_uri;
}

# Redirect HTTP → HTTPS www (both apex and www)
server {
    listen 80;
    listen [::]:80;
    server_name cleenzo.co.in www.cleenzo.co.in;
    return 301 https://www.cleenzo.co.in$request_uri;
}

# Primary site — www only
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.cleenzo.co.in;

    root /var/www/cleenzo.co.in/html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/cleenzo.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cleenzo.co.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Legacy / guessed URLs → canonical pages (with trailing slash)
    location = /laundry-service-raj-nagar-extension {
        return 301 https://www.cleenzo.co.in/laundry-service-ghaziabad/;
    }
    location = /laundry-service-raj-nagar-extension/ {
        return 301 https://www.cleenzo.co.in/laundry-service-ghaziabad/;
    }
    location = /shoe-cleaning-ghaziabad {
        return 301 https://www.cleenzo.co.in/shoe-cleaning/;
    }
    location = /shoe-cleaning-ghaziabad/ {
        return 301 https://www.cleenzo.co.in/shoe-cleaning/;
    }
    location = /commercial-laundry-ghaziabad {
        return 301 https://www.cleenzo.co.in/commercial-laundry/;
    }
    location = /commercial-laundry-ghaziabad/ {
        return 301 https://www.cleenzo.co.in/commercial-laundry/;
    }

    # SPA: directories get trailing slash; /path/index.html served as /path/
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /sitemap.xml {
        try_files $uri =404;
        add_header Content-Type "application/xml";
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
