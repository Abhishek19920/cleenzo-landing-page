# Nginx config for cleenzo.co.in — apply on EC2 at /etc/nginx/sites-available/cleenzo-frontend
# Canonical host: www.cleenzo.co.in (matches sitemap & canonical meta tags)

# Redirect bare domain HTTPS → www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cleenzo.co.in;

    # Reuse certbot-managed certificate paths (adjust if certbot used combined cert)
    ssl_certificate     /etc/letsencrypt/live/cleenzo.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cleenzo.co.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.cleenzo.co.in$request_uri;
}

# Redirect HTTP → HTTPS www
server {
    listen 80;
    listen [::]:80;
    server_name cleenzo.co.in www.cleenzo.co.in;
    return 301 https://www.cleenzo.co.in$request_uri;
}

# Primary site — www only
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.cleenzo.co.in;

    root /var/www/cleenzo.co.in/html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/cleenzo.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cleenzo.co.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Explicitly allow crawlers
    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /sitemap.xml {
        try_files $uri =404;
        add_header Content-Type "application/xml";
        add_header Cache-Control "public, max-age=86400";
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
