# Nginx for cleenzo.co.in — apply on EC2: ./apply-nginx-seo.sh
# Canonical host: https://cleenzo.co.in (apex — Search Console property)
# Canonical paths: trailing slash (matches prerender folders + sitemap)
#
# Do NOT strip ".html" from URLs (that breaks /about/index.html → /about/index).

# www HTTPS → apex (keep path + query)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.cleenzo.co.in;

    ssl_certificate     /etc/letsencrypt/live/cleenzo.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cleenzo.co.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://cleenzo.co.in$request_uri;
}

# HTTP → HTTPS apex (apex + www)
server {
    listen 80;
    listen [::]:80;
    server_name cleenzo.co.in www.cleenzo.co.in;
    return 301 https://cleenzo.co.in$request_uri;
}

# Primary site — apex only
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cleenzo.co.in;

    root /var/www/cleenzo.co.in/html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/cleenzo.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cleenzo.co.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ---- Legacy / guessed URLs → canonical pages ----
    location = /laundry-service-raj-nagar-extension {
        return 301 https://cleenzo.co.in/laundry-service-ghaziabad/;
    }
    location = /laundry-service-raj-nagar-extension/ {
        return 301 https://cleenzo.co.in/laundry-service-ghaziabad/;
    }
    location = /shoe-cleaning-ghaziabad {
        return 301 https://cleenzo.co.in/shoe-cleaning/;
    }
    location = /shoe-cleaning-ghaziabad/ {
        return 301 https://cleenzo.co.in/shoe-cleaning/;
    }
    location = /commercial-laundry-ghaziabad {
        return 301 https://cleenzo.co.in/commercial-laundry/;
    }
    location = /commercial-laundry-ghaziabad/ {
        return 301 https://cleenzo.co.in/commercial-laundry/;
    }

    # Old blog slugs sometimes crawled without current names
    location = /blog/express-laundry-quality-checks {
        return 301 https://cleenzo.co.in/blog/express-laundry-quality-checks/;
    }
    location = /blog/why-german-chemicals-fabric-care {
        return 301 https://cleenzo.co.in/blog/why-german-chemicals-fabric-care/;
    }
    location = /blog/dry-cleaning-vs-laundry-guide {
        return 301 https://cleenzo.co.in/blog/dry-cleaning-vs-laundry-guide/;
    }
    location = /blog/stain-removal-german-chemicals {
        return 301 https://cleenzo.co.in/blog/stain-removal-german-chemicals/;
    }
    location = /blog/barcode-tracking-garments {
        return 301 https://cleenzo.co.in/blog/barcode-tracking-garments/;
    }
    location = /blog/how-we-do-spot-cleaning {
        return 301 https://cleenzo.co.in/blog/how-we-do-spot-cleaning/;
    }

    # Trailing-slash normalize for top-level sections (no file extension)
    location ~ ^/(about|blog|commercial-laundry|laundry-service-ghaziabad|dry-cleaning-ghaziabad|dry-cleaners-raj-nagar-extension|shoe-cleaning|sofa-cleaning|carpet-cleaning|curtain-cleaning)$ {
        return 301 https://cleenzo.co.in$uri/;
    }

    # Blog post without trailing slash → with slash
    location ~ ^/blog/([a-z0-9-]+)$ {
        return 301 https://cleenzo.co.in/blog/$1/;
    }

    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /sitemap.xml {
        try_files $uri =404;
        add_header Content-Type "application/xml";
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.(?:js|css|png|jpe?g|gif|svg|webp|avif|ico|woff2?|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Prefer prerendered build/<route>/index.html over SPA fallback
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }
}
