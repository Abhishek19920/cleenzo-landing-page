name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          REACT_APP_SITE_URL: ${{ secrets.REACT_APP_SITE_URL }}
          REACT_APP_CLEENZO_API_URL: ${{ secrets.REACT_APP_CLEENZO_API_URL }}
          REACT_APP_COMMERCIAL_API_URL: ${{ secrets.REACT_APP_COMMERCIAL_API_URL }}
        run: |
          export REACT_APP_SITE_URL="${REACT_APP_SITE_URL:-https://cleenzo.co.in}"
          npm run build

      - name: Write deploy metadata
        run: |
          printf '%s\n' "{\"commit\":\"${GITHUB_SHA}\",\"branch\":\"${GITHUB_REF_NAME}\",\"builtAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"repo\":\"cleenzo-landing-page\"}" > build/deploy-info.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleenzo-build
          path: build/
          retention-days: 7

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Verify deployment secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e

          if [ -z "$EC2_HOST" ]; then
            echo "::error::EC2_HOST is not configured"
            exit 1
          fi

          if [ -z "$EC2_SSH_PRIVATE_KEY" ] && [ -z "$EC2_SSH_KEY" ]; then
            echo "::error::Configure EC2_SSH_PRIVATE_KEY or EC2_SSH_KEY in repo secrets"
            exit 1
          fi

          echo "Deployment secrets are configured."

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: cleenzo-build
          path: build

      - name: Configure SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -n "$EC2_SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          else
            printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          fi

          chmod 600 ~/.ssh/deploy_key

          echo "SSH private key configured."

      - name: Test SSH connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -e

          DEPLOY_USER="${EC2_USER:-ubuntu}"

          echo "Testing connection to EC2..."

          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            "${DEPLOY_USER}@${EC2_HOST}" \
            "echo 'EC2 SSH connection successful'"

      - name: Deploy website (PM2 on :3003)
        env:
          GITHUB_SHA: ${{ github.sha }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          set -e

          DEPLOY_USER="${EC2_USER:-ubuntu}"
          APP_DIR="${EC2_APP_DIR:-/home/ubuntu/cleenzo-website}"
          PM2_NAME="${PM2_APP_NAME:-cleenzo-website}"
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          echo "Deploying build to ${APP_DIR}/build (commit ${GITHUB_SHA})..."
          echo "nginx proxies cleenzo.co.in → PM2 ${PM2_NAME} on port 3003"

          ssh ${SSH_OPTS} "${DEPLOY_USER}@${EC2_HOST}" "mkdir -p '${APP_DIR}/build'"

          rsync \
            -avz \
            --delete \
            -e "ssh ${SSH_OPTS}" \
            build/ \
            "${DEPLOY_USER}@${EC2_HOST}:${APP_DIR}/build/"

          ssh ${SSH_OPTS} "${DEPLOY_USER}@${EC2_HOST}" \
            "pm2 restart '${PM2_NAME}' && sleep 1 && curl -sf http://127.0.0.1:3003/ | grep -q main."

      - name: Deployment summary
        run: |
          echo "======================================"
          echo "Cleenzo website deployed successfully"
          echo "======================================"
          echo "https://cleenzo.co.in"
